<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Earline">
<meta name="description" content="Turtle-neck alerts that learn your posture.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Earline</title>
<style>
/* Apple iOS look: system font, grouped background, inset grouped lists, system colors */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.16); --segsel:#FFFFFF;
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --pink:#FF2D55; --gray:#8E8E93; --cyan:#32ADE6; --indigo:#5856D6; --teal:#30B0C7;
  --bar:rgba(249,249,249,.94); --banner:rgba(246,246,246,.88);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --lvl:var(--gray);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --segsel:#636366;
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --pink:#FF375F; --cyan:#64D2FF; --indigo:#5E5CE6; --teal:#40C8E0;
    --bar:rgba(22,22,22,.92); --banner:rgba(44,44,46,.9);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--label);font:17px/1.29 var(--font);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
[data-level="ok"]{--lvl:var(--green)} [data-level="warn"]{--lvl:var(--orange)} [data-level="bad"]{--lvl:var(--red)}

/* ---------- screens ---------- */
.screen{max-width:980px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.navbar{display:flex;align-items:center;justify-content:flex-end;gap:2px;height:44px;margin-top:env(safe-area-inset-top)}
.navbar .left{margin-right:auto}
.nb{width:44px;height:44px;border:0;background:none;color:var(--blue);display:grid;place-items:center;border-radius:10px}
.nb svg{width:23px;height:23px}
.nbtext{border:0;background:none;color:var(--blue);font-size:17px;height:44px;padding:0 4px}
.large{font-size:34px;line-height:41px;font-weight:700;margin:0 0 14px;letter-spacing:.01em}

/* ---------- cards & lists ---------- */
.card{background:var(--card);border-radius:12px;padding:16px}
.grid{display:grid;gap:16px}
.list{background:var(--card);border-radius:10px;overflow:hidden;margin-bottom:34px}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;width:100%;border:0;background:none;text-align:left;font-size:17px}
.cell+.cell::before,.cell+details::before,details+.cell::before{content:"";position:absolute;top:0;right:0;left:57px;border-top:.5px solid var(--sep)}
.list.noicon .cell+.cell::before{left:16px}
button.cell:active,summary.cell:active{background:var(--fill)}
.cell .t{flex:1;min-width:0}
.cell .v{color:var(--label2);white-space:nowrap}
.cell.action .t{color:var(--blue)}
.cell.danger .t{color:var(--red)}
.ico{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:18px;height:18px}
.chev{width:9px;height:14px;color:var(--label3);flex:none}
.cell select{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--label2);font-size:17px;text-align:right;direction:rtl;padding:0;cursor:pointer}
.cell select option{direction:ltr}
details{position:relative}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary .chev{transform:rotate(90deg)}
.fieldcell input{flex:1;border:0;background:none;font-size:17px;padding:11px 0;outline:none;min-width:0}
.fieldcell input::placeholder{color:var(--label3)}

/* iOS switch */
.sw{appearance:none;-webkit-appearance:none;margin:0;flex:none;position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill2);transition:background .25s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}

/* iOS slider */
.slidercell{flex-wrap:wrap;padding:11px 16px 14px}
.slidercell .slider{flex-basis:100%;margin-top:12px}
.slider{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--blue) var(--p,50%),var(--fill2) var(--p,50%));margin:0;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}
.slider::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}
.btn:not([disabled]):active{opacity:.75}
.plain{display:block;width:100%;height:44px;border:0;background:none;color:var(--blue);font-size:17px}
.spin{width:18px;height:18px;border:2.2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;height:28px;border:0;background:none;border-radius:7px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--segsel);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}

/* ---------- onboarding (Apple welcome sheet) ---------- */
.welcome{max-width:400px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(56px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.appicon{width:92px;height:92px;border-radius:21px;margin:0 auto 22px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.welcome h1{font-size:34px;line-height:41px;font-weight:700;text-align:center;margin:0}
.welcome .sub{color:var(--label2);text-align:center;margin-top:6px}
.feats{list-style:none;margin:44px 0 0;padding:0 8px;display:grid;gap:26px}
.feats li{display:flex;align-items:center;gap:18px;font-size:17px;font-weight:600}
.feats svg{width:34px;height:34px;flex:none}
.welcome .bottom{margin-top:auto;padding-top:32px}
.privacy{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--label2);text-align:center;margin-bottom:18px}
.privacy svg{width:24px;height:24px;color:var(--blue)}
.foot{font-size:13px;color:var(--label2);text-align:center;min-height:18px;margin-top:10px}
.foot.err{color:var(--red)}

/* ---------- calibration (Face ID style) ---------- */
.enroll{max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 24px calc(24px + env(safe-area-inset-bottom))}
.enroll .navbar{justify-content:flex-start}
.enroll h1{font-size:28px;line-height:34px;font-weight:700;text-align:center;margin:14px 0 0}
.enroll .sub{color:var(--label2);text-align:center;margin-top:8px;min-height:22px}
.ring-cam{position:relative;width:min(290px,76vw);aspect-ratio:1;margin:34px auto 0}
.ring-cam .ticks{position:absolute;inset:0;width:100%;height:100%}
.ring-cam .ticks line{stroke:var(--fill2);stroke-width:3.2;stroke-linecap:round;transition:stroke .15s}
.ring-cam .ticks line.on{stroke:var(--green)}
.lens{position:absolute;inset:11%;border-radius:50%;overflow:hidden;background:#000}
.lens .cam{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:50%}
.ring-cam .count{position:absolute;inset:11%;display:grid;place-items:center;font:700 96px var(--round);color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.45);pointer-events:none}
.ring-cam .done{position:absolute;inset:11%;display:grid;place-items:center;border-radius:50%;background:var(--card)}
.ring-cam .done svg{width:46%;height:46%}
.enroll .bottom{margin-top:auto;padding-top:28px}

/* ---------- camera ---------- */
.cam{position:relative;width:100%;aspect-ratio:var(--ar,4/3);overflow:hidden;background:#000;border-radius:10px}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.cam video{object-fit:cover}
.cam canvas{object-fit:cover}

/* ---------- posture tab ---------- */
.now{display:flex;align-items:center;gap:20px}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .track{stroke:var(--lvl);opacity:.2;transition:stroke .4s}
.ring .prog{stroke:var(--lvl);transition:stroke-dashoffset .5s ease,stroke .4s}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.ring .num small{font-size:17px;font-weight:600;margin-left:1px}
.now .status{font-size:22px;line-height:28px;font-weight:700}
.now .neck{color:var(--label2);font-size:15px;margin-top:4px;min-height:20px}
.figbox{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--bg)}
.figbox .cam{position:absolute;inset:0;height:100%;aspect-ratio:auto;border-radius:0}
.fig{display:block;width:100%;height:100%}
.fig .gl{stroke:var(--sep);stroke-width:.6;opacity:.6}
.fig .plumb{stroke:var(--label3);stroke-width:1.5;stroke-dasharray:3 5}
.fig .level{stroke:var(--lvl);stroke-width:1.5;stroke-dasharray:3 5;transition:stroke .4s}
.fig .sil{fill:var(--label);opacity:.86;transition:opacity .4s}
.fig .mk{fill:var(--lvl);stroke:var(--bg);stroke-width:3;transition:fill .4s}
.fig .bracket line{stroke:var(--lvl);stroke-width:2;transition:stroke .4s}
.fig[data-level="away"] .sil{opacity:.22}
.metrics{display:flex;gap:28px}
.metrics .cap{font-size:13px;font-weight:600;color:var(--label2)}
.metrics b{display:block;font:700 28px/1.15 var(--round);font-variant-numeric:tabular-nums}
.metrics b small{font-size:17px;font-weight:600}
#timeline{width:100%;height:84px;display:block;margin-top:14px}

/* ---------- devices tab ---------- */
.summary .cap{font-size:15px;font-weight:600;color:var(--label2)}
.summary b{display:block;font:700 54px/1.05 var(--round);font-variant-numeric:tabular-nums;margin-top:2px}
.summary b small{font-size:28px}
.cell .sub2{display:block;font-size:13px;color:var(--label2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;vertical-align:middle}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);background:var(--bar);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border-top:.5px solid var(--sep)}
.tabbar button{flex:1;max-width:180px;height:49px;border:0;background:none;color:#999999;display:grid;place-items:center}
.tabbar button[aria-current="page"]{color:var(--blue)}
.tabbar svg{width:28px;height:28px}

/* ---------- iOS notification banner ---------- */
.banner{position:fixed;z-index:50;left:50%;top:max(8px,env(safe-area-inset-top));width:min(400px,calc(100% - 16px));transform:translate(-50%,-140%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.25,1.08),visibility 0s .45s;display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:22px;background:var(--banner);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer;border:0;text-align:left;color:var(--label)}
.banner.show{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.25,1.08)}
.banner img{width:38px;height:38px;border-radius:9px;flex:none}
.banner .bt{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.banner .bt span{font-size:13px;font-weight:400;color:var(--label2)}
.banner p{font-size:15px}
.banner>div{flex:1}
.hud{position:fixed;z-index:49;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:var(--banner);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100vw - 32px)}
.hud.show{opacity:1}

@media (min-width: 860px){
  .grid.posture{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start}
  .grid.posture .figcard{grid-row:span 2}
  .figbox{aspect-ratio:4/5}
  .settings-wrap,.devices-wrap{max-width:620px;margin:0 auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ========== welcome ========== -->
<section data-view="onboard" hidden>
  <div class="welcome">
    <img class="appicon" src="icon-180.png" alt="">
    <h1>Earline</h1>
    <p class="sub">Turtle-neck alerts that learn you.</p>
    <ul class="feats">
      <li><svg viewBox="0 0 34 34" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11V7a2 2 0 0 1 2-2h4M23 5h4a2 2 0 0 1 2 2v4M29 23v4a2 2 0 0 1-2 2h-4M11 29H7a2 2 0 0 1-2-2v-4"/><circle cx="17" cy="14" r="4.2"/><path d="M10.5 25c1.2-3.4 3.6-5 6.5-5s5.3 1.6 6.5 5"/></svg>Learns your posture</li>
      <li><svg viewBox="0 0 34 34" fill="var(--red)"><path d="M17 4.5c-4.9 0-8.3 3.8-8.3 8.6v5.3l-2.6 3.9c-.6.9 0 2.1 1.1 2.1h19.6c1.1 0 1.7-1.2 1.1-2.1l-2.6-3.9v-5.3c0-4.8-3.4-8.6-8.3-8.6zM13.6 26.5a3.5 3.5 0 0 0 6.8 0z"/></svg>Alerts you in seconds</li>
      <li><svg viewBox="0 0 34 34" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="19" height="13.5" rx="2"/><path d="M8 25h10"/><rect x="24.5" y="11" width="7" height="16" rx="1.8"/></svg>Works on every device</li>
    </ul>
    <div class="bottom">
      <p class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 4.5 6v5.6c0 4.7 3.2 8.4 7.5 9.6 4.3-1.2 7.5-4.9 7.5-9.6V6z"/><path d="m8.8 12.1 2.2 2.2 4.3-4.4"/></svg>Video stays on this device.</p>
      <button class="btn" id="btnBegin">Continue</button>
      <p class="foot" id="obStatus" role="status" aria-live="polite"></p>
    </div>
  </div>
</section>

<!-- ========== calibration ========== -->
<section data-view="calib" hidden>
  <div class="enroll">
    <div class="navbar"><button class="nbtext" id="calCancel">Cancel</button></div>
    <h1 id="calTitle">Sit up straight</h1>
    <p class="sub" id="calSub">Keep your face in the circle.</p>
    <div class="ring-cam">
      <svg class="ticks" id="calTicks" viewBox="0 0 300 300" aria-hidden="true"></svg>
      <div class="lens" id="camSlotCalib"></div>
      <div class="count" id="camCount" hidden></div>
      <div class="done" id="calDone" hidden></div>
    </div>
    <p class="foot" id="calHint"></p>
    <div class="bottom">
      <button class="btn" id="calBtn">Start</button>
      <button class="plain" id="calBtn2" hidden></button>
    </div>
  </div>
</section>

<!-- ========== posture ========== -->
<section data-view="monitor" class="screen" hidden>
  <div class="navbar">
    <button class="nb" id="btnWidget" aria-label="Mini widget" title="Mini widget" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="15" rx="2.5"/><rect x="12" y="11" width="7" height="5.5" rx="1.2" fill="currentColor"/></svg></button>
    <button class="nb" data-act="calib" aria-label="Recalibrate" title="Recalibrate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5v4.6h-4.6"/></svg></button>
    <button class="nb" id="btnPause" aria-label="Pause" title="Pause"></button>
  </div>
  <h1 class="large">Posture</h1>
  <div class="grid posture">
    <div class="card now" id="nowCard" data-level="ok">
      <div class="ring" id="ring">
        <svg viewBox="0 0 128 128" aria-hidden="true"><circle class="track" cx="64" cy="64" r="55"/><circle class="prog" cx="64" cy="64" r="55"/></svg>
        <div class="num" id="ringNum">–</div>
      </div>
      <div><p class="status" id="mStatus">–</p><p class="neck" id="mSub"></p>
        <button class="btn" data-act="calib" id="mCal" hidden style="height:36px;border-radius:18px;font-size:15px;width:auto;padding:0 16px;margin-top:10px">Calibrate</button></div>
    </div>
    <div class="card figcard">
      <div class="seg" role="group" aria-label="View">
        <button id="segFig" aria-pressed="true">Figure</button>
        <button id="segCam" aria-pressed="false">Camera</button>
      </div>
      <div class="figbox" id="figBox"><div id="camSlotMonitor"></div></div>
    </div>
    <div class="card">
      <div class="metrics">
        <div><span class="cap">Upright</span><b id="stGood">–</b></div>
        <div><span class="cap">Alerts</span><b id="stAlerts">0</b></div>
      </div>
      <canvas id="timeline" aria-label="Last 5 minutes"></canvas>
    </div>
  </div>
</section>

<!-- ========== devices ========== -->
<section data-view="devices" class="screen" hidden>
  <div class="navbar"></div>
  <div class="devices-wrap">
    <h1 class="large">Devices</h1>
    <div class="card summary" style="margin-bottom:34px"><span class="cap">Upright today</span><b id="totPct">–</b></div>
    <div class="list" id="devList"></div>
  </div>
</section>

<!-- ========== settings ========== -->
<section data-view="settings" class="screen" hidden>
  <div class="navbar"></div>
  <div class="settings-wrap">
    <h1 class="large">Settings</h1>

    <div class="list">
      <label class="cell"><span class="ico" style="background:var(--gray)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg></span><span class="t">Device</span>
        <select id="devSel"><option value="laptop">Laptop</option><option value="tablet">Tablet</option><option value="phone">Phone</option></select>
        <svg class="chev" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 6 5.5-6 5.5"/></svg></label>
      <button class="cell action" data-act="calib"><span class="ico" style="background:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5v4.6h-4.6"/></svg></span><span class="t">Recalibrate</span></button>
    </div>

    <div class="list">

<script type="module">
/* Earline: collect samples -> train personal model -> live risk vs threshold (same 3 steps as Face-id) */
const MP_VER = '0.10.14';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL_FACE = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const MODEL_POSE = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const CUSHION_SERVICE = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CUSHION_CHAR    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
const BUZZ_STRENGTH = 205;
const HOLD_SEC = 3, COOLDOWN_SEC = 60;
const SAMPLES_PER_POSE = 60;
const TICK_MONITOR = 200, TICK_CALIB = 100;
const SIM = new URLSearchParams(location.search).has('sim');   // dev: run without camera/models

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const deg = r => r * 180 / Math.PI;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: ((a.z || 0) + (b.z || 0)) / 2 });
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

/* storage */
const Store = {
  get(k, d) { try { const v = localStorage.getItem('earline.' + k); return v ? JSON.parse(v) ?? d : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('earline.' + k, JSON.stringify(v)); } catch {} },
  clear() { try { Object.keys(localStorage).filter(k => k.startsWith('earline.')).forEach(k => localStorage.removeItem(k)); } catch {} }
};

/* cloud DB (Supabase REST, optional) */
const Cloud = {
  cfg() { return Store.get('cloud', null); },
  on() { const c = this.cfg(); return !!(c && c.url && c.key && c.user); },
  async req(path, opts = {}) {
    const c = this.cfg();
    const r = await fetch(c.url.replace(/\/+$/, '') + '/rest/v1/' + path, {
      ...opts, headers: { apikey: c.key, Authorization: 'Bearer ' + c.key, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
    if (!r.ok) throw new Error(`Error ${r.status}`);
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  async pushProfile(p) {
    const c = this.cfg();
    await this.req('posture_profiles?on_conflict=user_code,profile_key', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_code: c.user, profile_key: p.key, device: p.device, data: p, updated_at: new Date(p.updatedAt).toISOString() })
    });
  },
  async pullProfiles() { const c = this.cfg(); return await this.req(`posture_profiles?user_code=eq.${encodeURIComponent(c.user)}&select=profile_key,data,updated_at`) || []; },
  async pushDaily(day, device, s) {
    const c = this.cfg();
    await this.req('posture_daily?on_conflict=user_code,day,device', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_code: c.user, day, device, good_sec: s.good, bad_sec: s.bad, alerts: s.alerts, updated_at: new Date().toISOString() })
    });
  },
  async pullDaily(day) { const c = this.cfg(); return await this.req(`posture_daily?user_code=eq.${encodeURIComponent(c.user)}&day=eq.${day}&select=device,good_sec,bad_sec,alerts`) || []; }
};

/* devices */
const DEV = { laptop: 'Laptop', tablet: 'Tablet', phone: 'Phone' };
const DEV_ICON = {
  laptop: ['var(--gray)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>'],
  tablet: ['var(--indigo)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg>'],
  phone:  ['var(--green)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>'],
  cushion:['var(--orange)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="10" width="18" height="8.5" rx="3.5" fill="currentColor"/><path d="M7.5 5.5c.8.8.8 1.8 0 2.6M12 5c.9 1 .9 2.2 0 3.2M16.5 5.5c.8.8.8 1.8 0 2.6"/></svg>']
};
const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>';
const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.6c0-.8.9-1.3 1.6-.9l10.6 6.6c.7.4.7 1.4 0 1.8L9.1 18.7c-.7.4-1.6-.1-1.6-.9z"/></svg>';
const CHECK_SVG = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--green)"/><path d="M29 51.5 43.5 66 72 36" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const WARN_SVG = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--orange)"/><path d="M50 27v30" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="72" r="5" fill="#fff"/></svg>';
function detectDevice() {
  const ua = navigator.userAgent;
  const iPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  if (/iPad/.test(ua) || iPadOS || (/Android/.test(ua) && !/Mobile/.test(ua))) return 'tablet';
  if (/iPhone|iPod|Android.*Mobile|Mobile/.test(ua)) return 'phone';
  return 'laptop';
}
function orientation() {
  const t = screen.orientation?.type;
  if (t) return t.startsWith('landscape') ? 'landscape' : 'portrait';
  return innerWidth > innerHeight ? 'landscape' : 'portrait';
}
// tablets/phones: one model per orientation (camera sits somewhere else)
const profileKey = () => S.device === 'laptop' ? 'laptop' : `${S.device}-${orientation()}`;

/* state */
const S = {
  device: Store.get('device', null) || detectDevice(),
  view: 'onboard', started: false, paused: false,
  settings: Object.assign({ threshold: 90, sound: true, buzz: true, camView: false }, Store.get('settings', {})),
  profiles: Store.get('profiles', {}),
  stats: Store.get('stats', {}),
  cloudDaily: {},
  stream: null, video: $('#video'), overlay: $('#overlay'), frameW: 640, frameH: 480, imageCapture: null,
  vision: null, busy: false, lastTs: 0, lastVT: -1, lastVTAt: 0,
  smooth: null, neck: null, level: 'away', mode: '', badSince: null, lastAlert: 0, lastTick: 0, history: [], lastHist: 0,
  cushion: { dev: null, ch: null }, pip: null, wake: null
};

/* ---------- vision (MediaPipe, on-device) ---------- */
async function initVision() {
  if (SIM) return makeSimVision();
  const { FilesetResolver, FaceLandmarker, PoseLandmarker } = await import(`${MP_URL}/vision_bundle.mjs`);
  const fs = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
  const make = async (Cls, opts) => {
    try { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: 'GPU' } }); }
    catch (e) { console.warn('GPU failed, using CPU', e); return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: 'CPU' } }); }
  };
  const [face, pose] = await Promise.all([
    make(FaceLandmarker, { baseOptions: { modelAssetPath: MODEL_FACE }, runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true, outputFaceBlendshapes: false }),
    make(PoseLandmarker, { baseOptions: { modelAssetPath: MODEL_POSE }, runningMode: 'VIDEO', numPoses: 1 })
  ]);
  return { detect: (src, ts) => ({ face: face.detectForVideo(src, ts), pose: pose.detectForVideo(src, ts) }) };
}
// face: head tilt, face size, face height in frame, face shape ratio, chin-to-nose
function faceFeatures(lm, matrix, W, H) {
  const P = i => ({ x: lm[i].x * W, y: lm[i].y * H });
  const eR = P(33), eL = P(263), nose = P(1), chin = P(152), top = P(10), cl = P(234), cr = P(454);
  const iod = dist(eR, eL) || 1, fw = dist(cl, cr) || 1, fh = dist(top, chin);
  let pitch, yaw = 0;
  if (matrix?.data) {
    const m = matrix.data;
    pitch = deg(Math.atan2(m[6], m[10]));
    yaw = deg(Math.asin(clamp(-m[2], -1, 1)));
  } else pitch = deg(Math.atan2(nose.y - (eR.y + eL.y) / 2, iod));
  return { vec: [pitch, iod / W * 100, nose.y / H * 100, fh / fw, (chin.y - nose.y) / iod], yaw, iod, nose, eyes: [eR, eL], chin };
}
// shoulders: width, ear-shoulder height, nose-shoulder height, head/shoulder ratio, 3D neck angle (CVA)
function poseFeatures(lm, world, W, H, iodPx) {
  const vis = i => lm[i] && (lm[i].visibility ?? 1) > 0.6 && lm[i].y < 1.02;
  if (!vis(11) || !vis(12)) return null;
  const P = i => ({ x: lm[i].x * W, y: lm[i].y * H });
  const sL = P(11), sR = P(12), sm = mid(sL, sR), sw = dist(sL, sR);
  if (sw < W * 0.08) return null;
  const earPts = [7, 8].filter(i => lm[i] && (lm[i].visibility ?? 1) > 0.3).map(P);
  const earMid = earPts.length === 2 ? mid(earPts[0], earPts[1]) : earPts[0] || P(0);
  const nose = P(0);
  let cva = 0;
  if (world?.[11] && world?.[7]) {
    const ws = mid(world[11], world[12]), we = mid(world[7], world[8]);
    cva = deg(Math.atan2(ws.y - we.y, Math.abs(we.z - ws.z) + 1e-3));
  }
  return { vec: [sw / W * 100, (sm.y - earMid.y) / sw, (sm.y - nose.y) / sw, iodPx / sw, cva], sL, sR, earMid };
}
function extract(r) {
  const W = S.frameW, H = S.frameH;
  let face = null, pose = null;
  const fl = r.face?.faceLandmarks?.[0];
  if (fl) face = faceFeatures(fl, r.face.facialTransformationMatrixes?.[0], W, H);
  const pl = r.pose?.landmarks?.[0];
  if (pl && face) pose = poseFeatures(pl, r.pose.worldLandmarks?.[0], W, H, face.iod);
  return { face, pose };
}

/* ---------- personal model: standardized features + L2 logistic regression ---------- */
const sigmoid = z => 1 / (1 + Math.exp(-z));
const LR = {
  train(X, y, { l2 = 0.02, epochs = 500, lr = 0.3 } = {}) {
    const n = X.length, d = X[0].length;
    const mu = Array(d).fill(0), sd = Array(d).fill(0);
    for (const r of X) r.forEach((v, j) => mu[j] += v / n);
    for (const r of X) r.forEach((v, j) => sd[j] += (v - mu[j]) ** 2 / n);
    for (let j = 0; j < d; j++) sd[j] = Math.sqrt(sd[j]) > 1e-6 ? Math.sqrt(sd[j]) : 1;
    const Z = X.map(r => r.map((v, j) => (v - mu[j]) / sd[j]));
    const n1 = y.reduce((a, b) => a + b, 0), n0 = n - n1;
    const cw = [n / (2 * Math.max(n0, 1)), n / (2 * Math.max(n1, 1))];
    const w = Array(d).fill(0); let b = 0;
    for (let e = 0; e < epochs; e++) {
      const gw = Array(d).fill(0); let gb = 0;
      for (let i = 0; i < n; i++) {
        let z = b; for (let j = 0; j < d; j++) z += w[j] * Z[i][j];
        const err = (sigmoid(z) - y[i]) * cw[y[i]];
        for (let j = 0; j < d; j++) gw[j] += err * Z[i][j];
        gb += err;
      }
      for (let j = 0; j < d; j++) w[j] -= lr * (gw[j] / n + l2 * w[j]);
      b -= lr * gb / n;
    }
    return { mu, sd, w, b };
  },
  prob(m, x) { let z = m.b; for (let j = 0; j < m.w.length; j++) z += m.w[j] * ((x[j] - m.mu[j]) / m.sd[j]); return sigmoid(z); }
};
function trainProfile(good, bad) {
  const split = a => { const k = Math.max(1, Math.floor(a.length * 0.8)); return [a.slice(0, k), a.slice(k)]; };
  const [gTr, gVa] = split(good), [bTr, bVa] = split(bad);
  const fit = (sel, g, b) => {
    const X = [], y = [];
    for (const s of g) { const x = sel(s); if (x) { X.push(x); y.push(0); } }
    for (const s of b) { const x = sel(s); if (x) { X.push(x); y.push(1); } }
    return X.length >= 10 && y.includes(0) && y.includes(1) ? LR.train(X, y) : null;
  };
  const acc = (m, sel, g, b) => {
    let ok = 0, n = 0;
    for (const s of g) { const x = sel(s); if (x) { n++; if (LR.prob(m, x) < 0.5) ok++; } }
    for (const s of b) { const x = sel(s); if (x) { n++; if (LR.prob(m, x) >= 0.5) ok++; } }
    return n ? ok / n : 0;
  };
  const selFace = s => s.f, selFull = s => s.p ? [...s.f, ...s.p] : null;
  const poseShare = a => a.filter(s => s.p).length / a.length;
  const useFull = poseShare(good) >= 0.6 && poseShare(bad) >= 0.6;
  const sel = useFull ? selFull : selFace;
  const valModel = fit(sel, gTr, bTr);
  const withPose = good.filter(s => s.p);
  const now = Date.now();
  return {
    key: profileKey(), device: S.device, createdAt: now, updatedAt: now,
    face: fit(selFace, good, bad), full: useFull ? fit(selFull, good, bad) : null,
    valAcc: valModel ? acc(valModel, sel, gVa, bVa) : 0,
    yaw0: good.reduce((a, s) => a + s.yaw, 0) / good.length,
    neck0: withPose.length ? withPose.reduce((a, s) => a + s.p[1], 0) / withPose.length : null,
    samples: { good: good.length, bad: bad.length }
  };
}
function predict(prof, obs) {
  if (!obs.face) return { p: null, look: false };
  if (Math.abs(obs.face.yaw - prof.yaw0) > 35) return { p: null, look: true };
  return { p: (prof.full && obs.pose) ? LR.prob(prof.full, [...obs.face.vec, ...obs.pose.vec]) : LR.prob(prof.face, obs.face.vec), look: false };
}

/* ---------- camera + loop (Worker timer keeps running in background tabs) ---------- */
function cameraError(e) {
  const m = { NotAllowedError: 'Camera access is off. Allow it in your browser settings.', NotFoundError: 'No camera found.', NotReadableError: 'Another app is using the camera.' };
  return new Error(m[e.name] || `Camera error (${e.name || e.message})`);
}
async function startCamera() {
  if (S.stream) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    if (SIM) return;
    throw new Error(isSecureContext ? 'This browser can\'t use the camera.' : 'Open this page over https.');
  }
  try { S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false }); }
  catch (e) { if (SIM) return; throw cameraError(e); }
  const v = S.video;
  v.srcObject = S.stream;
  await v.play().catch(() => {});
  if (v.readyState < 2) await new Promise(r => v.addEventListener('loadeddata', r, { once: true }));
  const sync = () => { S.frameW = v.videoWidth || 640; S.frameH = v.videoHeight || 480; $('#camFrame').style.setProperty('--ar', `${S.frameW}/${S.frameH}`); };
  sync(); v.addEventListener('resize', sync);
  if ('ImageCapture' in window) { try { S.imageCapture = new ImageCapture(S.stream.getVideoTracks()[0]); } catch {} }
}
async function getFrame() {
  const v = S.video;
  if (SIM && !S.stream) return { src: null };
  if (!v || v.readyState < 2) return null;
  const now = performance.now();
  if (v.currentTime !== S.lastVT) { S.lastVT = v.currentTime; S.lastVTAt = now; }
  else if (document.hidden && S.imageCapture && now - S.lastVTAt > 1500) {
    try { const bmp = await S.imageCapture.grabFrame(); return { src: bmp, done: () => bmp.close() }; } catch {}
  }
  return { src: v };
}

/* ---------- step 3: live risk + alerts ---------- */
function monitorTick(obs) {

  const r = predict(prof, obs);

let swReg = null, audioCtx = null, titleTimer = null;

let figN = 0;
function figureMarkup() {

    <defs><pattern id="${id}" width="20" height="20" patternUnits="userSpaceOnUse"><path class="gl" d="M20 0H0V20" fill="none"/></pattern></defs>

    <line class="level" x1="-200" x2="520"/>
    <g class="sil"><path class="body"/><rect class="neck" rx="12"/><ellipse class="head"/></g>
    <g class="bracket"><line class="bv"/><line class="bt1"/><line class="bt2"/></g>
    <circle class="mk earL" r="6"/><circle class="mk earR" r="6"/><circle class="mk shL" r="6"/><circle class="mk shR" r="6"/>

function drawFigure(svg, t) {

  const sy = L(262, 250), hw = L(98, 90), drop = L(26, 12);     // shoulders rise and round
  const nw = L(42, 46);

  A(q('.body'), { d: `M136 ${sy - 12} Q${160 - hw + 12} ${sy - 4} ${160 - hw} ${sy + drop} Q${160 - hw - 16} ${sy + 60} ${160 - hw - 14} 380 L${160 + hw + 14} 380 Q${160 + hw + 16} ${sy + 60} ${160 + hw} ${sy + drop} Q${160 + hw - 12} ${sy - 4} 184 ${sy - 12}Z` });
  const neckTop = hcy + ry * 0.5;
  A(q('.neck'), { x: 160 - nw / 2, y: neckTop, width: nw, height: Math.max(0, sy - neckTop + 8) });
  A(q('.head'), { cx: 160, cy: hcy, rx, ry });
  const earY = hcy + 6, shY = sy + drop - 3;
  A(q('.earL'), { cx: 160 - rx + 2, cy: earY }); A(q('.earR'), { cx: 160 + rx - 2, cy: earY });
  A(q('.shL'), { cx: 160 - hw + 4, cy: shY }); A(q('.shR'), { cx: 160 + hw - 4, cy: shY });
  A(q('.level'), { y1: shY, y2: shY });
  const bx = 160 + hw + 26;

  A(q('.bt1'), { x1: bx - 7, y1: earY, x2: bx + 7, y2: earY });

}

/* timeline (Health-style line) */

  else if (C.step === 'done') { if (C.result.valAcc >= 0.8) { S.smooth = null; goto('monitor'); } else calibReset(); }
};
$('#calBtn2').onclick = () => { if (C.step !== 'done') return; if (C.result.valAcc >= 0.8) calibReset(); else { S.smooth = null; goto('monitor'); } };
$('#calCancel').onclick = () => goto('monitor');
$('#segFig').onclick = () => { S.settings.camView = false; saveSettings(); mountCamera(); };
$('#segCam').onclick = () => { S.settings.camView = true; saveSettings(); mountCamera(); };
function setPauseIcon() { const b = $('#btnPause'); b.innerHTML = S.paused ? PLAY_SVG : PAUSE_SVG; b.ariaLabel = b.title = S.paused ? 'Resume' : 'Pause'; }
$('#btnPause').onclick = () => { S.paused = !S.paused; setPauseIcon(); if (S.paused) { S.smooth = null; hideAlert(); } S.lastTick = 0; render(); };
if ('documentPictureInPicture' in window) { $('#btnWidget').hidden = false; $('#btnWidget').onclick = () => openWidget().catch(e => toast(e.message)); }
function onOrientation() {
  if (S.device === 'laptop') return;
  S.smooth = null; S.badSince = null;
  if (S.view === 'calib') calibReset(); else render();
}
if (screen.orientation?.addEventListener) screen.orientation.addEventListener('change', onOrientation);
else addEventListener('orientationchange', onOrientation);
addEventListener('resize', () => { if (S.view === 'monitor') drawTimeline(); });

/* ---------- vibration cushion (Web Bluetooth, output only) ---------- */
async function toggleCushion() {
  const cu = S.cushion;
  if (cu.dev) { try { cu.dev.gatt.disconnect(); } catch {} cu.dev = null; cu.ch = null; renderCushion(); return; }
  if (!navigator.bluetooth) { toast('Bluetooth isn\'t available in this browser'); return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [CUSHION_SERVICE] }] });
    const server = await dev.gatt.connect();
    cu.ch = await (await server.getPrimaryService(CUSHION_SERVICE)).getCharacteristic(CUSHION_CHAR);
    dev.addEventListener('gattserverdisconnected', () => { cu.dev = null; cu.ch = null; renderCushion(); toast('Cushion disconnected'); });
    cu.dev = dev; renderCushion(); toast('Cushion connected');
    buzz(2);
  } catch (e) { if (e.name !== 'NotFoundError') toast('Couldn\'t connect'); }
}
async function buzz(pattern) {   // 1 = alert (double), 2 = test (single)
  const ch = S.cushion.ch; if (!ch) return;
  const data = new Uint8Array([pattern, BUZZ_STRENGTH]);
  try {
    if (ch.properties?.write && ch.writeValueWithResponse) await ch.writeValueWithResponse(data);
    else if (ch.writeValueWithoutResponse) await ch.writeValueWithoutResponse(data);
    else await ch.writeValue(data);
  } catch (e) { console.warn(e); }
}
function renderCushion() {
  $('#cushionVal').innerHTML = S.cushion.dev ? '<span class="dot"></span>Connected' : 'Connect';
  $('#cushionVal').style.color = S.cushion.dev ? '' : 'var(--blue)';
  if (S.view === 'devices') renderDevices();
}
$('#btnCushion').onclick = toggleCushion;

/* ---------- settings ---------- */
function saveSettings() { Store.set('settings', S.settings); }
function paintSlider() { const el = $('#setThr'); el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }
function renderSettings() {
  const s = S.settings;
  $('#devSel').value = S.device;
  $('#setThr').value = s.threshold; $('#setThrOut').textContent = s.threshold + '%'; paintSlider();
  $('#setSound').checked = s.sound; $('#setBuzz').checked = s.buzz;
  const c = Cloud.cfg() || {};
  $('#dbUrl').value = c.url || ''; $('#dbKey').value = c.key || ''; $('#dbUser').value = c.user || '';
  $('#dbState').textContent = Cloud.on() ? 'On' : 'Off';
  renderNotif(); renderCushion();
}
function renderNotif() {
  const ua = navigator.userAgent, v = $('#notifVal');
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!('Notification' in window)) { v.textContent = isIOS && !standalone ? 'Add to Home Screen' : 'Unavailable'; return; }
  const p = Notification.permission;
  v.textContent = p === 'granted' ? 'On' : p === 'denied' ? 'Blocked' : 'Off';
}
$('#btnNotif').onclick = async () => {
  if (!('Notification' in window)) { toast(/iPhone|iPad/.test(navigator.userAgent) ? 'Share → Add to Home Screen, then open from there' : 'Not supported here'); return; }
  if (Notification.permission === 'denied') { toast('Turn on notifications in browser settings'); return; }
  await Notification.requestPermission(); renderNotif();
  if (Notification.permission === 'granted') pushNotify('Earline', 'Notifications are on.');
};
$('#devSel').onchange = e => { S.device = e.target.value; Store.set('device', S.device); S.smooth = null; S.badSince = null; };
$('#setThr').oninput = e => { S.settings.threshold = +e.target.value; $('#setThrOut').textContent = e.target.value + '%'; paintSlider(); saveSettings(); };
$('#setSound').onchange = e => { S.settings.sound = e.target.checked; saveSettings(); if (e.target.checked) { unlockAudio(); chime(); } };
$('#setBuzz').onchange = e => { S.settings.buzz = e.target.checked; saveSettings(); };
$('#btnDbSave').onclick = async () => {
  const url = $('#dbUrl').value.trim(), key = $('#dbKey').value.trim(), user = $('#dbUser').value.trim();
  if (!url || !key || !user) { toast('Fill in all three fields'); return; }
  Store.set('cloud', { url, key, user });
  $('#dbState').textContent = '…';
  try { await syncFromCloud(); $('#dbState').textContent = 'On'; toast('Synced'); } catch (e) { $('#dbState').textContent = 'Off'; toast(e.message); }
};
$('#btnDbOff').onclick = () => { Store.set('cloud', null); S.cloudDaily = {}; renderSettings(); };
async function syncFromCloud() {
  const rows = await Cloud.pullProfiles();
  for (const r of rows) {
    const local = S.profiles[r.profile_key];
    if (!local || (r.data.updatedAt || 0) > (local.updatedAt || 0)) S.profiles[r.profile_key] = r.data;
  }
  for (const p of Object.values(S.profiles)) {
    const r = rows.find(x => x.profile_key === p.key);
    if (!r || (p.updatedAt || 0) > (r.data.updatedAt || 0)) await Cloud.pushProfile(p);
  }
  Store.set('profiles', S.profiles);
  await refreshCloudDaily();
}
async function refreshCloudDaily() {
  if (!Cloud.on()) return;
  try {
    const rows = await Cloud.pullDaily(today());
    S.cloudDaily = Object.fromEntries(rows.map(r => [r.device, { good: r.good_sec, bad: r.bad_sec, alerts: r.alerts }]));
    if (S.view === 'devices') renderDevices();
  } catch (e) { console.warn(e); }
}
$('#btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'earline', version: 4, profiles: S.profiles, stats: S.stats }, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `earline-${today()}.json` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'earline') throw new Error('Not an Earline file');
    Object.assign(S.profiles, d.profiles || {}); Store.set('profiles', S.profiles); toast('Imported');
  } catch (err) { toast(err.message); }
  e.target.value = '';
};
$('#btnReset').onclick = () => {
  if (!confirm('Erase all data on this device?')) return;
  Store.clear(); S.profiles = {}; S.stats = {}; S.history = []; toast('Erased'); renderSettings();
};

let toastTimer;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400); }

/* ---------- simulation (?sim) ---------- */
function makeSimVision() {
  window.__sim = window.__sim || { slouch: 0, present: true };
  addEventListener('keydown', e => { if (e.key === 't') __sim.slouch = __sim.slouch > .5 ? 0 : 1; if (e.key === 'a') __sim.present = !__sim.present; });
  const nz = (a = 0.006) => (Math.random() - .5) * a;
  return {
    detect() {
      const s = __sim.slouch;
      if (!__sim.present) return { face: { faceLandmarks: [] }, pose: { landmarks: [] } };
      const sc = 1 + 0.22 * s, cy = 0.40 + 0.09 * s + nz(), cx = 0.5 + nz();
      const lm = Array.from({ length: 478 }, () => ({ x: cx, y: cy, z: 0 }));
      const set = (i, dx, dy) => lm[i] = { x: cx + dx * sc + nz(), y: cy + dy * sc + nz(), z: 0 };
      set(33, -0.06, -0.03); set(263, 0.06, -0.03); set(1, 0, 0.02 + 0.01 * s); set(152, 0, 0.12 - 0.015 * s);
      set(10, 0, -0.13 + 0.01 * s); set(234, -0.1, 0); set(454, 0.1, 0);
      const pitch = (6 + 20 * s + nz(3)) * Math.PI / 180, yaw = nz(4) * Math.PI / 180;
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const data = [1, 0, -Math.sin(yaw), 0, 0, cp, sp, 0, 0, -sp, cp, 0, 0, 0, 0, 1];
      const pl = Array.from({ length: 33 }, () => ({ x: .5, y: .5, z: 0, visibility: 0.2 }));
      const P = (i, x, y) => pl[i] = { x: x + nz(), y: y + nz(), z: 0, visibility: 0.95 };
      P(11, 0.68, 0.80); P(12, 0.32, 0.80); P(0, cx, cy + 0.02 * sc); P(7, cx + 0.1 * sc, cy); P(8, cx - 0.1 * sc, cy);
      const wl = Array.from({ length: 33 }, () => ({ x: 0, y: 0, z: 0 }));
      wl[11] = { x: .17, y: -.45, z: 0 }; wl[12] = { x: -.17, y: -.45, z: 0 };
      wl[7] = { x: .07, y: -.62 + .03 * s, z: -.02 - .08 * s + nz(.01) }; wl[8] = { x: -.07, y: -.62 + .03 * s, z: -.02 - .08 * s + nz(.01) };
      return { face: { faceLandmarks: [lm], facialTransformationMatrixes: [{ data }] }, pose: { landmarks: [pl], worldLandmarks: [wl] } };
    }
  };
}

/* ---------- boot ---------- */
$('#figBox').insertAdjacentHTML('afterbegin', figureMarkup());
{ const svg = $('#figBox svg'); drawFigure(svg, 0); figState.set(svg, { cur: 0, target: 0 }); svg.dataset.level = 'away'; }
setPauseIcon();
{ const pr = $('#ring .prog'); pr.style.strokeDasharray = RING_C; pr.style.strokeDashoffset = RING_C; }
goto('onboard');
if (Cloud.on()) syncFromCloud().catch(e => console.warn(e));
window.__earline = { S, C, LR, trainProfile, predict };

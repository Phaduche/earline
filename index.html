<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Earline">
<meta name="description" content="Personal turtle-neck alerts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Earline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,700..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F7F8FA; --board:#ECF0F5; --grid:#DCE3EC; --grid-major:#C3CDDA;
  --ink:#0E1A33; --ink-2:#47546E; --ink-3:#8590A6; --rule:#DEE3EA;
  --ok:#14936A; --warn:#DB940A; --bad:#EE2E6C;
  --display:"Big Shoulders","Big Shoulders Display","Arial Narrow",sans-serif;
  --body:Archivo,-apple-system,"Segoe UI",system-ui,sans-serif;
  --lvl:var(--ink-3);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0B1120; --board:#111A2C; --grid:#19233A; --grid-major:#253252;
    --ink:#E9EEF7; --ink-2:#A3AECB; --ink-3:#6C7795; --rule:#1E2945;
    --ok:#3CCB95; --warn:#F5B53A; --bad:#FF5A8E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bad);outline-offset:3px}
[hidden]{display:none!important}
p{margin:0}
[data-level="ok"]{--lvl:var(--ok)} [data-level="warn"]{--lvl:var(--warn)} [data-level="bad"]{--lvl:var(--bad)}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:14px 28px;background:var(--page);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.brand svg{width:28px;height:28px}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{position:relative;border:0;background:none;width:44px;height:40px;display:grid;place-items:center;color:var(--ink-3)}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-15px;height:3px;background:var(--bad)}

main{max-width:1100px;margin:0 auto;padding:32px 28px 110px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:13px 22px;font-weight:600;font-size:15px;background:var(--ink);color:var(--page)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.small{padding:8px 13px;font-size:14px}
.ibtn{width:44px;height:44px;border:0;border-radius:6px;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule);display:grid;place-items:center}
.ibtn svg{width:20px;height:20px}
.ibtn:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* board */
.board{position:relative;background:var(--board);border-radius:4px;overflow:hidden}
.fig{display:block;width:100%;height:100%}
.fig .gl{stroke:var(--grid);stroke-width:1}
.fig .glM{stroke:var(--grid-major);stroke-width:1}
.fig .plumb{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:3 5}
.fig .level{stroke:var(--lvl);stroke-width:1.5;stroke-dasharray:3 5;transition:stroke .4s}
.fig .body,.fig .neck,.fig .head{fill:var(--ink)}
.fig .mk{fill:var(--lvl);stroke:var(--board);stroke-width:3;transition:fill .4s}
.fig .bracket line{stroke:var(--lvl);stroke-width:2;transition:stroke .4s}
.fig[data-level="away"] .body,.fig[data-level="away"] .neck,.fig[data-level="away"] .head{fill:var(--ink-3);opacity:.35}
.chip{position:absolute;left:12px;top:12px;font-size:13px;font-weight:700;background:var(--page);padding:6px 9px;border-radius:3px;box-shadow:0 0 0 1px var(--grid-major);font-variant-numeric:tabular-nums}
.inset{position:absolute;right:12px;top:12px;width:30%;min-width:110px;max-width:210px}
.inset .cam{border-radius:3px;box-shadow:0 0 0 1px var(--grid-major)}

/* onboarding */
.onboard{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;min-height:calc(100dvh - 180px)}
.onboard h1{margin:0 0 32px;font-family:var(--display);font-weight:800;font-size:clamp(60px,8vw,112px);line-height:.92}
.onboard .board{aspect-ratio:8/9;max-height:72vh;width:100%}
.fine{margin-top:18px;font-size:13px;color:var(--ink-3)}
.err{color:var(--bad);font-weight:600}

/* camera */
.cam{position:relative;width:100%;aspect-ratio:var(--ar,4/3);overflow:hidden;background:#080d18;border-radius:4px}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.cam video{object-fit:cover}
.cam .count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:150px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.45);pointer-events:none}
.cam .oval{position:absolute;left:50%;top:42%;width:32%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.6);border-radius:50%;pointer-events:none}
.cam .hint{position:absolute;left:12px;bottom:12px;font-size:14px;font-weight:600;color:#fff;background:rgba(8,13,24,.7);padding:6px 10px;border-radius:4px;pointer-events:none}

/* calibration */
.calib{display:grid;grid-template-columns:1.3fr .7fr;gap:40px;align-items:center}
.dots{display:flex;gap:8px;margin-bottom:22px}
.dots i{width:28px;height:4px;background:var(--rule)}
.dots i.done{background:var(--ok)} .dots i.now{background:var(--bad)}
.say{font-family:var(--display);font-weight:800;font-size:52px;line-height:.95;margin-bottom:24px}
.tape{position:relative;height:30px;background:var(--board);border-radius:3px;overflow:hidden;margin-bottom:8px}
.tape .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--bad);transition:width .12s linear}
.tape .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/60 - 1px),color-mix(in srgb,var(--ink) 22%,transparent) calc(100%/60 - 1px) calc(100%/60))}
.tape .ticks::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 2px),color-mix(in srgb,var(--ink) 45%,transparent) calc(100%/6 - 2px) calc(100%/6));clip-path:inset(0 0 45% 0)}
.count2{text-align:right;font-size:13px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-bottom:22px}
.acc{font-family:var(--display);font-weight:900;font-size:120px;line-height:.82}
.acc small{display:block;font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink-3);margin:10px 0 26px}

/* monitor */
.monitor{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
.monitor .board{aspect-ratio:8/9;max-height:calc(100dvh - 160px);width:100%}
.pct{font-family:var(--display);font-weight:900;font-size:clamp(140px,16vw,220px);line-height:.8;color:var(--lvl);font-variant-numeric:tabular-nums;transition:color .4s}
.pct small{font-size:.42em;margin-left:2px}
.status{font-size:28px;font-weight:700;margin-top:16px;letter-spacing:-.01em}
#timeline{width:100%;height:70px;display:block;margin-top:28px}
.mini{display:flex;gap:32px;margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.mini b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.mini span{font-size:13px;color:var(--ink-3)}
.controls{display:flex;gap:8px;margin-top:24px}

/* devices */
.devices{max-width:640px}
.big{font-family:var(--display);font-weight:900;font-size:130px;line-height:.82;font-variant-numeric:tabular-nums}
.big+small{display:block;font-size:14px;font-weight:600;color:var(--ink-3);margin:10px 0 30px}
.dlist{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.dlist li{display:grid;grid-template-columns:26px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule)}
.dlist svg{width:24px;height:24px;display:block;color:var(--ink-2)}
.dlist .name{font-weight:600}
.dlist .name.here{color:var(--bad)}
.dlist .val{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}

/* settings */
.settings{max-width:560px}
.field{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:58px;border-bottom:1px solid var(--rule)}
.field:first-child{border-top:1.5px solid var(--ink)}
.field>label,.field>span:first-child{font-weight:600}
.field select{border:1.5px solid var(--rule);background:var(--page);border-radius:5px;padding:7px 10px}
.range{display:flex;align-items:center;gap:10px}
.range input{width:150px;accent-color:var(--bad)}
.range output{font-family:var(--display);font-weight:800;font-size:26px;width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.switch input{appearance:none;-webkit-appearance:none;margin:0;position:relative;width:46px;height:26px;border-radius:5px;background:var(--grid-major);transition:background .2s;cursor:pointer;display:block}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:3px;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(20px)}
details{border-bottom:1px solid var(--rule)}
summary{list-style:none;cursor:pointer;min-height:58px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.dbody{display:grid;gap:10px;padding:0 0 18px}
.dbody input[type=text],.dbody input[type=password]{width:100%;border:1.5px solid var(--rule);background:var(--page);border-radius:5px;padding:10px 12px}
.note{font-size:13px;color:var(--ink-3)}

/* alert + toast */
.alert{position:fixed;z-index:50;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-150%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1.15),visibility 0s .3s;display:flex;align-items:center;gap:18px;padding:10px 10px 10px 18px;border-radius:6px;background:var(--bad);color:#fff;box-shadow:0 14px 34px -14px rgba(238,46,108,.7)}
.alert.show{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.3,1.15)}
.alert b{font-size:17px;white-space:nowrap}
.alert button{border:0;background:#fff;color:var(--bad);font-weight:700;padding:8px 14px;border-radius:4px}
.toast{position:fixed;z-index:49;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:9px 14px;border-radius:5px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

@media (max-width: 920px){
  .onboard,.calib,.monitor{grid-template-columns:1fr;gap:26px}
  .onboard{min-height:auto}
  .onboard .board{order:-1;aspect-ratio:5/4;max-height:52vh}
  .monitor .board{aspect-ratio:5/4;max-height:none}
}
@media (max-width: 640px){
  .top{padding:12px 16px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;gap:0;background:var(--page);border-top:1px solid var(--rule);padding:0 0 env(safe-area-inset-bottom)}
  .nav button{flex:1;height:58px;width:auto}
  .nav button svg{width:26px;height:26px}
  .nav button[aria-current="page"]::after{top:0;bottom:auto;left:38%;right:38%}
  main{padding:20px 16px 100px}
  .onboard h1{font-size:62px}
  .monitor .board{aspect-ratio:1/1}
  .say{font-size:42px}
  .acc,.big{font-size:100px}
  .range input{width:110px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#" data-go="home" aria-label="Earline home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="5" fill="currentColor"/><path d="M5 32 Q6 25 11 23.5 L21 23.5 Q26 25 27 32Z" fill="var(--page)"/><rect x="13.5" y="17" width="5" height="8" rx="2" fill="var(--page)"/><ellipse cx="16" cy="12.5" rx="5.6" ry="6.6" fill="var(--page)"/><circle cx="10.6" cy="13.4" r="1.9" fill="#EE2E6C"/><circle cx="21.4" cy="13.4" r="1.9" fill="#EE2E6C"/></svg>
    Earline
  </a>
  <nav class="nav" aria-label="Main">
    <button data-go="monitor" aria-label="Posture" title="Posture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="8" rx="3.6" ry="4.2"/><path d="M10.6 12v2.2M13.4 12v2.2M4 21c.6-3.6 2.8-5.6 6-6.2h4c3.2.6 5.4 2.6 6 6.2"/></svg></button>
    <button data-go="devices" aria-label="Devices" title="Devices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="13" height="9.5" rx="1.5"/><path d="M5.5 18h7"/><rect x="17.5" y="8" width="4.5" height="11.5" rx="1.2"/></svg></button>
    <button data-go="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </nav>
</header>

<main>
  <section data-view="onboard" class="onboard">
    <div>
      <h1>Your neck shouldn't disappear.</h1>
      <button class="btn" id="btnBegin">Start</button>
      <p id="obStatus" class="fine" role="status" aria-live="polite">Video stays on this device.</p>
    </div>
    <div class="board" id="obBoard" data-level="ok"></div>
  </section>

  <section data-view="calib" class="calib" hidden>
    <div id="camSlotCalib"></div>
    <div id="calBody"></div>
  </section>

  <section data-view="monitor" class="monitor" hidden>
    <div class="board" id="mBoard">
      <div class="inset" id="camSlotMonitor"></div>
      <p class="chip" id="mChip" hidden></p>
    </div>
    <div id="readout" data-level="ok">
      <div class="pct" id="mPct">–<small>%</small></div>
      <p class="status" id="mStatus">–</p>
      <button class="btn small" data-act="calib" id="mCal" hidden style="margin-top:16px">Calibrate</button>
      <canvas id="timeline" aria-label="Last 5 minutes"></canvas>
      <div class="mini">
        <div><b id="stGood">–</b><span>upright today</span></div>
        <div><b id="stAlerts">0</b><span>alerts</span></div>
      </div>
      <div class="controls">
        <button class="ibtn" id="btnPause" aria-label="Pause" title="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button class="ibtn" id="btnWidget" aria-label="Mini widget" title="Mini widget" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4" width="18" height="15" rx="1.5"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg></button>
        <button class="ibtn" data-act="calib" aria-label="Recalibrate" title="Recalibrate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
    </div>
  </section>

  <section data-view="devices" class="devices" hidden>
    <div class="big" id="totPct">–</div><small>upright today</small>
    <ul class="dlist" id="devList"></ul>
  </section>

  <section data-view="settings" class="settings" hidden>
    <div class="field"><label for="devSel">Device</label>
      <select id="devSel"><option value="laptop">Laptop</option><option value="tablet">Tablet</option><option value="phone">Phone</option></select></div>
    <div class="field"><label for="setThr">Alert at</label>
      <div class="range"><input type="range" id="setThr" min="60" max="99" step="1"><output id="setThrOut">90</output></div></div>
    <div class="field"><label for="setSound">Sound</label><span class="switch"><input type="checkbox" id="setSound"></span></div>
    <div class="field"><span>Notifications</span><button class="btn small line" id="btnNotif">Allow</button></div>
    <div class="field"><label for="setPreview">Camera preview</label><span class="switch"><input type="checkbox" id="setPreview"></span></div>
    <div class="field"><span>Cushion</span><button class="btn small line" id="btnCushion">Connect</button></div>
    <div class="field"><label for="setBuzz">Buzz on alert</label><span class="switch"><input type="checkbox" id="setBuzz"></span></div>
    <div class="field"><span>Calibration</span><button class="btn small line" data-act="calib">Redo</button></div>
    <details>
      <summary>Cloud sync</summary>
      <div class="dbody">
        <input type="text" id="dbUrl" placeholder="Supabase URL" autocomplete="off" spellcheck="false" aria-label="Supabase URL">
        <input type="password" id="dbKey" placeholder="Anon key" autocomplete="off" spellcheck="false" aria-label="Anon key">
        <input type="text" id="dbUser" placeholder="Your code" autocomplete="off" spellcheck="false" aria-label="Your code">
        <div class="row"><button class="btn small" id="btnDbSave">Sync</button><button class="btn small line" id="btnDbOff">Disconnect</button><span class="note" id="dbState"></span></div>
      </div>
    </details>
    <details>
      <summary>Data</summary>
      <div class="dbody row">
        <button class="btn small line" id="btnExport">Export</button>
        <label class="btn small line" for="importFile">Import</label>
        <input type="file" id="importFile" accept="application/json" hidden>
        <button class="btn small line" id="btnReset" style="color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)">Erase</button>
      </div>
    </details>
  </section>
</main>

<div id="camFrame" class="cam" hidden>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="oval" id="camOval" hidden></div>
  <div class="count" id="camCount" hidden></div>
  <div class="hint" id="camHint" hidden></div>
</div>

<div class="alert" id="alert" role="alert"><b>Turtle neck</b><button id="alertOk">OK</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* Earline: collect samples -> train personal model -> live risk vs threshold (same 3 steps as Face-id) */
const MP_VER = '0.10.14';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL_FACE = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const MODEL_POSE = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const CUSHION_SERVICE = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CUSHION_CHAR    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
const BUZZ_STRENGTH = 205;
const HOLD_SEC = 3, COOLDOWN_SEC = 60;
const SAMPLES_PER_POSE = 60;
const TICK_MONITOR = 200, TICK_CALIB = 100;
const SIM = new URLSearchParams(location.search).has('sim');   // dev: run without camera/models

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const deg = r => r * 180 / Math.PI;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: ((a.z || 0) + (b.z || 0)) / 2 });

/* ---------- vision (MediaPipe, on-device) ---------- */
async function initVision() {
  if (SIM) return makeSimVision();
  const { FilesetResolver, FaceLandmarker, PoseLandmarker } = await import(`${MP_URL}/vision_bundle.mjs`);
  const fs = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
  const make = async (Cls, opts) => {
    try { return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: 'GPU' } }); }
    catch (e) { console.warn('GPU failed, using CPU', e); return await Cls.createFromOptions(fs, { ...opts, baseOptions: { ...opts.baseOptions, delegate: 'CPU' } }); }
  };
  const [face, pose] = await Promise.all([
    make(FaceLandmarker, { baseOptions: { modelAssetPath: MODEL_FACE }, runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true, outputFaceBlendshapes: false }),
    make(PoseLandmarker, { baseOptions: { modelAssetPath: MODEL_POSE }, runningMode: 'VIDEO', numPoses: 1 })
  ]);
  return { detect: (src, ts) => ({ face: face.detectForVideo(src, ts), pose: pose.detectForVideo(src, ts) }) };
}
// face: head tilt, face size, face height in frame, face shape ratio, chin-to-nose
function faceFeatures(lm, matrix, W, H) {
  const P = i => ({ x: lm[i].x * W, y: lm[i].y * H });
  const eR = P(33), eL = P(263), nose = P(1), chin = P(152), top = P(10), cl = P(234), cr = P(454);
  const iod = dist(eR, eL) || 1, fw = dist(cl, cr) || 1, fh = dist(top, chin);
  let pitch, yaw = 0;
  if (matrix?.data) {
    const m = matrix.data;
    pitch = deg(Math.atan2(m[6], m[10]));
    yaw = deg(Math.asin(clamp(-m[2], -1, 1)));
  } else pitch = deg(Math.atan2(nose.y - (eR.y + eL.y) / 2, iod));
  return { vec: [pitch, iod / W * 100, nose.y / H * 100, fh / fw, (chin.y - nose.y) / iod], yaw, iod, nose, eyes: [eR, eL], chin };
}
// shoulders: width, ear-shoulder height, nose-shoulder height, head/shoulder ratio, 3D neck angle (CVA)
function poseFeatures(lm, world, W, H, iodPx) {
  const vis = i => lm[i] && (lm[i].visibility ?? 1) > 0.6 && lm[i].y < 1.02;
  if (!vis(11) || !vis(12)) return null;
  const P = i => ({ x: lm[i].x * W, y: lm[i].y * H });
  const sL = P(11), sR = P(12), sm = mid(sL, sR), sw = dist(sL, sR);
  if (sw < W * 0.08) return null;
  const earPts = [7, 8].filter(i => lm[i] && (lm[i].visibility ?? 1) > 0.3).map(P);
  const earMid = earPts.length === 2 ? mid(earPts[0], earPts[1]) : earPts[0] || P(0);
  const nose = P(0);
  let cva = 0;
  if (world?.[11] && world?.[7]) {
    const ws = mid(world[11], world[12]), we = mid(world[7], world[8]);
    cva = deg(Math.atan2(ws.y - we.y, Math.abs(we.z - ws.z) + 1e-3));
  }
  return { vec: [sw / W * 100, (sm.y - earMid.y) / sw, (sm.y - nose.y) / sw, iodPx / sw, cva], sL, sR, earMid };
}
function extract(r) {
  const W = S.frameW, H = S.frameH;
  let face = null, pose = null;
  const fl = r.face?.faceLandmarks?.[0];
  if (fl) face = faceFeatures(fl, r.face.facialTransformationMatrixes?.[0], W, H);
  const pl = r.pose?.landmarks?.[0];
  if (pl && face) pose = poseFeatures(pl, r.pose.worldLandmarks?.[0], W, H, face.iod);
  return { face, pose };
}

/* ---------- personal model: standardized features + L2 logistic regression ---------- */
const sigmoid = z => 1 / (1 + Math.exp(-z));
const LR = {
  train(X, y, { l2 = 0.02, epochs = 500, lr = 0.3 } = {}) {
    const n = X.length, d = X[0].length;
    const mu = Array(d).fill(0), sd = Array(d).fill(0);
    for (const r of X) r.forEach((v, j) => mu[j] += v / n);
    for (const r of X) r.forEach((v, j) => sd[j] += (v - mu[j]) ** 2 / n);
    for (let j = 0; j < d; j++) sd[j] = Math.sqrt(sd[j]) > 1e-6 ? Math.sqrt(sd[j]) : 1;
    const Z = X.map(r => r.map((v, j) => (v - mu[j]) / sd[j]));
    const n1 = y.reduce((a, b) => a + b, 0), n0 = n - n1;
    const cw = [n / (2 * Math.max(n0, 1)), n / (2 * Math.max(n1, 1))];
    const w = Array(d).fill(0); let b = 0;
    for (let e = 0; e < epochs; e++) {
      const gw = Array(d).fill(0); let gb = 0;
      for (let i = 0; i < n; i++) {
        let z = b; for (let j = 0; j < d; j++) z += w[j] * Z[i][j];
        const err = (sigmoid(z) - y[i]) * cw[y[i]];
        for (let j = 0; j < d; j++) gw[j] += err * Z[i][j];
        gb += err;
      }
      for (let j = 0; j < d; j++) w[j] -= lr * (gw[j] / n + l2 * w[j]);
      b -= lr * gb / n;
    }
    return { mu, sd, w, b };
  },
  prob(m, x) { let z = m.b; for (let j = 0; j < m.w.length; j++) z += m.w[j] * ((x[j] - m.mu[j]) / m.sd[j]); return sigmoid(z); }
};
function trainProfile(good, bad) {
  const split = a => { const k = Math.max(1, Math.floor(a.length * 0.8)); return [a.slice(0, k), a.slice(k)]; };
  const [gTr, gVa] = split(good), [bTr, bVa] = split(bad);
  const fit = (sel, g, b) => {
    const X = [], y = [];
    for (const s of g) { const x = sel(s); if (x) { X.push(x); y.push(0); } }
    for (const s of b) { const x = sel(s); if (x) { X.push(x); y.push(1); } }
    return X.length >= 10 && y.includes(0) && y.includes(1) ? LR.train(X, y) : null;
  };
  const acc = (m, sel, g, b) => {
    let ok = 0, n = 0;
    for (const s of g) { const x = sel(s); if (x) { n++; if (LR.prob(m, x) < 0.5) ok++; } }
    for (const s of b) { const x = sel(s); if (x) { n++; if (LR.prob(m, x) >= 0.5) ok++; } }
    return n ? ok / n : 0;
  };
  const selFace = s => s.f, selFull = s => s.p ? [...s.f, ...s.p] : null;
  const poseShare = a => a.filter(s => s.p).length / a.length;
  const useFull = poseShare(good) >= 0.6 && poseShare(bad) >= 0.6;
  const sel = useFull ? selFull : selFace;
  const valModel = fit(sel, gTr, bTr);
  const withPose = good.filter(s => s.p);
  const now = Date.now();
  return {
    key: profileKey(), device: S.device, createdAt: now, updatedAt: now,
    face: fit(selFace, good, bad), full: useFull ? fit(selFull, good, bad) : null,
    valAcc: valModel ? acc(valModel, sel, gVa, bVa) : 0,
    yaw0: good.reduce((a, s) => a + s.yaw, 0) / good.length,
    neck0: withPose.length ? withPose.reduce((a, s) => a + s.p[1], 0) / withPose.length : null,
    samples: { good: good.length, bad: bad.length }
  };
}
function predict(prof, obs) {
  if (!obs.face) return { p: null, look: false };
  if (Math.abs(obs.face.yaw - prof.yaw0) > 35) return { p: null, look: true };
  return { p: (prof.full && obs.pose) ? LR.prob(prof.full, [...obs.face.vec, ...obs.pose.vec]) : LR.prob(prof.face, obs.face.vec), look: false };
}

/* ---------- camera + loop (Worker timer keeps running in background tabs) ---------- */
function cameraError(e) {
  const m = { NotAllowedError: 'Camera blocked. Allow it in the address bar.', NotFoundError: 'No camera found.', NotReadableError: 'Camera is in use by another app.' };
  return new Error(m[e.name] || `Camera error (${e.name || e.message})`);
}
async function startCamera() {
  if (S.stream) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    if (SIM) return;
    throw new Error(isSecureContext ? 'No camera support in this browser.' : 'Needs https or localhost.');
  }
  try { S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false }); }
  catch (e) { if (SIM) return; throw cameraError(e); }
  const v = S.video;
  v.srcObject = S.stream;
  await v.play().catch(() => {});
  if (v.readyState < 2) await new Promise(r => v.addEventListener('loadeddata', r, { once: true }));
  const sync = () => { S.frameW = v.videoWidth || 640; S.frameH = v.videoHeight || 480; $('#camFrame').style.setProperty('--ar', `${S.frameW}/${S.frameH}`); };
  sync(); v.addEventListener('resize', sync);
  if ('ImageCapture' in window) { try { S.imageCapture = new ImageCapture(S.stream.getVideoTracks()[0]); } catch {} }
}
async function getFrame() {
  const v = S.video;
  if (SIM && !S.stream) return { src: null };
  if (!v || v.readyState < 2) return null;
  const now = performance.now();
  if (v.currentTime !== S.lastVT) { S.lastVT = v.currentTime; S.lastVTAt = now; }
  else if (document.hidden && S.imageCapture && now - S.lastVTAt > 1500) {
    try { const bmp = await S.imageCapture.grabFrame(); return { src: bmp, done: () => bmp.close() }; } catch {}
  }
  return { src: v };
}
let ticker = null, fallbackTimer = null;
function setTickRate(ms) {
  if (ticker === null) {
    try {
      const src = 'let id;onmessage=e=>{clearInterval(id);if(e.data>0)id=setInterval(()=>postMessage(1),e.data)}';
      ticker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      ticker.onmessage = tick;
    } catch { ticker = false; }
  }
  if (ticker) ticker.postMessage(ms);
  else { clearInterval(fallbackTimer); fallbackTimer = setInterval(tick, ms); }
}
async function tick() {
  if (S.busy || !S.vision || S.paused || !S.started) return;
  S.busy = true;
  try {
    const fr = await getFrame(); if (!fr) return;
    const ts = Math.max(performance.now(), S.lastTs + 1); S.lastTs = ts;
    const raw = S.vision.detect(fr.src, ts);
    fr.done?.();
    const obs = extract(raw);
    if (S.view === 'calib') calibTick(obs); else monitorTick(obs);
    drawOverlay(obs);
  } catch (e) { console.warn(e); }
  finally { S.busy = false; }
}

/* ---------- step 1: collect samples ---------- */
const C = { step: 'good', state: 'idle', good: [], bad: [], result: null };
function calibReset() { C.step = 'good'; C.state = 'idle'; C.good = []; C.bad = []; C.result = null; renderCalib(); }
async function calibCapture() {
  if (C.state !== 'idle') return;
  C.state = 'countdown'; renderCalib();
  const cnt = $('#camCount');
  for (let i = 3; i > 0; i--) { cnt.hidden = false; cnt.textContent = i; await sleep(750); }
  cnt.hidden = true;
  C[C.step] = []; C.state = 'capturing'; renderCalib();
}
function calibTick(obs) {
  setHint(obs.face || C.step === 'done' ? '' : 'No face');
  if (C.state !== 'capturing' || !obs.face) return;
  const arr = C[C.step];
  arr.push({ f: obs.face.vec, p: obs.pose?.vec || null, yaw: obs.face.yaw });
  setTape(arr.length);
  if (arr.length >= SAMPLES_PER_POSE) {
    if (C.step === 'good') { C.step = 'bad'; C.state = 'idle'; renderCalib(); }
    else { C.step = 'train'; trainNow(); }
  }
}
/* step 2: train */
async function trainNow() {
  C.state = 'training'; renderCalib();
  await sleep(400);
  const prof = trainProfile(C.good, C.bad);
  S.profiles[prof.key] = prof; Store.set('profiles', S.profiles);
  if (Cloud.on()) Cloud.pushProfile(prof).catch(e => toast(e.message));
  C.result = prof; C.step = 'done'; C.state = 'idle';
  renderCalib();
}
const currentProfile = () => S.profiles[profileKey()] || null;

/* ---------- step 3: live risk + alerts ---------- */
function monitorTick(obs) {
  const prof = currentProfile();
  const now = performance.now();
  const dt = S.lastTick ? Math.min((now - S.lastTick) / 1000, 2) : 0;
  S.lastTick = now;
  if (!prof) { S.level = 'away'; S.mode = 'nocal'; render(); return; }
  const r = predict(prof, obs);
  S.mode = r.look ? 'look' : r.p == null ? 'away' : 'on';
  if (r.p == null) { S.smooth = null; S.neck = null; S.badSince = null; S.level = 'away'; render(); return; }
  S.smooth = S.smooth == null ? r.p : S.smooth + 0.3 * (r.p - S.smooth);
  if (prof.neck0 && obs.pose) { const n = obs.pose.vec[1] / prof.neck0; S.neck = S.neck == null ? n : S.neck + 0.2 * (n - S.neck); }
  else S.neck = null;
  const thr = S.settings.threshold / 100;
  S.level = S.smooth >= thr ? 'bad' : S.smooth >= 0.5 ? 'warn' : 'ok';
  const st = statToday();
  if (S.smooth >= 0.5) st.bad += dt; else st.good += dt;
  if (S.smooth >= thr) {
    S.badSince ??= now;
    if (now - S.badSince >= HOLD_SEC * 1000 && Date.now() - S.lastAlert >= COOLDOWN_SEC * 1000) fireAlert();
  } else if (S.smooth < thr - 0.08) {
    S.badSince = null;
    if (S.smooth < 0.5) hideAlert();
  }
  if (now - S.lastHist >= 1000) { S.history.push({ t: Date.now(), p: S.smooth }); S.lastHist = now; if (S.history.length > 300) S.history.shift(); }
  render();
}
function statToday() {
  const d = today();
  S.stats[d] ??= {};
  return (S.stats[d][S.device] ??= { good: 0, bad: 0, alerts: 0 });
}
let lastCloudPush = 0;
setInterval(async () => {
  Store.set('stats', S.stats);
  if (Cloud.on() && S.started && Date.now() - lastCloudPush > 60000) {
    lastCloudPush = Date.now();
    try { await Cloud.pushDaily(today(), S.device, statToday()); } catch (e) { console.warn(e); }
  }
}, 10000);

/* alerts */
let swReg = null, audioCtx = null, titleTimer = null;
async function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  try { swReg = await navigator.serviceWorker.register('sw.js'); } catch (e) { console.warn(e); }
}
function unlockAudio() { try { audioCtx ??= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {} }
function chime() {
  if (!S.settings.sound || !audioCtx) return;
  const t = audioCtx.currentTime;
  [[660, 0], [880, 0.16]].forEach(([f, d]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.18, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.45);
    o.connect(g).connect(audioCtx.destination); o.start(t + d); o.stop(t + d + 0.5);
  });
}

  try {

}

  }
}

/* ---------- simulation (?sim) ---------- */
function makeSimVision() {
  window.__sim = window.__sim || { slouch: 0, present: true };
  addEventListener('keydown', e => { if (e.key === 't') __sim.slouch = __sim.slouch > .5 ? 0 : 1; if (e.key === 'a') __sim.present = !__sim.present; });
  const nz = (a = 0.006) => (Math.random() - .5) * a;
  return {
    detect() {
      const s = __sim.slouch;
      if (!__sim.present) return { face: { faceLandmarks: [] }, pose: { landmarks: [] } };
      const sc = 1 + 0.22 * s, cy = 0.40 + 0.09 * s + nz(), cx = 0.5 + nz();
      const lm = Array.from({ length: 478 }, () => ({ x: cx, y: cy, z: 0 }));
      const set = (i, dx, dy) => lm[i] = { x: cx + dx * sc + nz(), y: cy + dy * sc + nz(), z: 0 };
      set(33, -0.06, -0.03); set(263, 0.06, -0.03); set(1, 0, 0.02 + 0.01 * s); set(152, 0, 0.12 - 0.015 * s);
      set(10, 0, -0.13 + 0.01 * s); set(234, -0.1, 0); set(454, 0.1, 0);
      const pitch = (6 + 20 * s + nz(3)) * Math.PI / 180, yaw = nz(4) * Math.PI / 180;
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const data = [1, 0, -Math.sin(yaw), 0, 0, cp, sp, 0, 0, -sp, cp, 0, 0, 0, 0, 1];
      const pl = Array.from({ length: 33 }, () => ({ x: .5, y: .5, z: 0, visibility: 0.2 }));
      const P = (i, x, y) => pl[i] = { x: x + nz(), y: y + nz(), z: 0, visibility: 0.95 };
      P(11, 0.68, 0.80); P(12, 0.32, 0.80); P(0, cx, cy + 0.02 * sc); P(7, cx + 0.1 * sc, cy); P(8, cx - 0.1 * sc, cy);
      const wl = Array.from({ length: 33 }, () => ({ x: 0, y: 0, z: 0 }));
      wl[11] = { x: .17, y: -.45, z: 0 }; wl[12] = { x: -.17, y: -.45, z: 0 };
      wl[7] = { x: .07, y: -.62 + .03 * s, z: -.02 - .08 * s + nz(.01) }; wl[8] = { x: -.07, y: -.62 + .03 * s, z: -.02 - .08 * s + nz(.01) };
      return { face: { faceLandmarks: [lm], facialTransformationMatrixes: [{ data }] }, pose: { landmarks: [pl], worldLandmarks: [wl] } };
    }
  };
}
